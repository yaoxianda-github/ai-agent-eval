id: T306
title: 跨文件关联销售计算
level: L3
description: |
  读取 input/products.csv（列：product_id, name, price）与 input/orders.csv
  （列：order_id, product_id, qty）。计算订单总销售额（每笔 qty × 对应商品 price 求和），
  将结果（保留两位小数的数字）写入 output/answer.txt。
  答案应只含数字（如 162.00）。
  （任务形态借鉴 GAIA 基准：跨文件关联 + 精确数字答案，判定为 exact match。）
tags: [data, join, calculation, gaia, exact_match]

fixtures:
  source: fixtures/

ground_truth:
  checkpoints:
    - id: c1
      type: file_exists
      path: output/answer.txt
      desc: 已写出答案
    - id: c2
      type: cmd_exit_zero
      cmd: "python @scripts/verify_t306.py ."
      desc: 独立复核：重算总销售额并与 answer.txt 精确比对

verifier: deterministic
weight: 1.5
cost_budget_usd: 0.1
timeout_s: 300
