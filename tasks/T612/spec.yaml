id: T612
title: 容错测试 - 错误参数自我纠正
level: L2
description: |
  input/data_tool.py 是一个数据处理 CLI 工具，需要 --input 参数指定输入文件。
  input/sales.csv 是待处理的销售数据文件。

  请使用 data_tool.py 处理 sales.csv 数据。注意：
  - 工具必须使用 --input 参数指定输入文件路径
  - 如果参数错误或缺失，工具会返回明确的错误信息和用法提示
  - 请根据错误提示纠正参数后重新调用

  最终需要生成 output/result.txt，包含记录数和金额总和。

  本任务考察 Agent 的容错与自我纠正能力：能否从工具的错误信息中学习正确用法，
  而不是反复用错误参数调用或直接放弃。
tags: [fault-tolerance, cli, parameter, self-correction]
capabilities: [execution, tools, lifecycle, verification]

fixtures:
  source: fixtures/

ground_truth:
  checkpoints:
    - id: c1
      type: file_exists
      path: output/result.txt
      desc: 已生成结果文件
    - id: c2
      type: content_contains
      path: output/result.txt
      pattern: "记录数: 5"
      desc: 记录数统计正确（5条数据）
    - id: c3
      type: content_contains
      path: output/result.txt
      pattern: "21114.50"
      desc: 金额总和计算正确（12999+89.5+5999+128+1899=21114.5）

verifier: deterministic
weight: 1.0
cost_budget_usd: 0.03
timeout_s: 300
