id: T502
title: 一周工作周报总结
level: L5
description: |
  基于 input/chat_logs.md 中的一周聊天记录，输出 output/weekly_report.md，
  结构需包含四个章节：本周完成事项、进行中事项、风险与阻塞、下周计划。
tags: [report, summarize]

fixtures:
  source: fixtures/

ground_truth:
  checkpoints:
    - id: c1
      type: file_exists
      path: output/weekly_report.md
      desc: 已生成周报
    - id: c2
      type: content_contains
      path: output/weekly_report.md
      pattern: "本周完成|完成事项"
      desc: 包含"本周完成"章节
    - id: c3
      type: content_contains
      path: output/weekly_report.md
      pattern: "进行中|进行事项"
      desc: 包含"进行中"章节
    - id: c4
      type: content_contains
      path: output/weekly_report.md
      pattern: "风险|阻塞|问题"
      desc: 包含"风险/阻塞"章节
    - id: c5
      type: content_contains
      path: output/weekly_report.md
      pattern: "下周|计划"
      desc: 包含"下周计划"章节

verifier: llm_judge
weight: 2.0
cost_budget_usd: 0.3
timeout_s: 600

# V2.2：llm_judge 语义判分的评分标准（任务作者自定义）
rubric: |
  请对周报质量判分（满分 100）：
  1. 内容完整性（30 分）：四个章节齐全——本周完成事项、进行中事项、风险与阻塞、下周计划；
  2. 信息准确性（25 分）：关键信息正确归类（导出功能、分页参数、P1 内存问题、发版、报表中心）；
  3. 组织清晰度（25 分）：要点提炼准确、无重复冗余；
  4. 语言表达（20 分）：通顺专业、无错别字。
  评分参考：>=85 优秀，70-84 良好，60-69 及格，<60 不达标。
